# Cocos Bank Timesheet - configuración común a los bloques server (HTTP y HTTPS).
# Copiar a /etc/nginx/snippets/timesheet-app.conf.

root /opt/timesheet/frontend/dist;
index index.html;

server_tokens off;
client_max_body_size 1m;

# Encabezados de seguridad (no se repiten add_header dentro de los location para no anularlos).
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "same-origin" always;
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; frame-ancestors 'none'" always;

gzip on;
gzip_types text/css application/javascript application/json image/svg+xml;

# API: al backend Node (systemd: timesheet-api.service).
location /api/ {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # La exportación de reportes grandes puede tardar.
    proxy_read_timeout 120s;
}

# Archivos de Vite con hash en el nombre: se pueden cachear para siempre.
location /assets/ {
    expires 1y;
    try_files $uri =404;
}

# Aplicación React (SPA): cualquier otra ruta devuelve index.html, que no se cachea.
location / {
    expires -1;
    try_files $uri /index.html;
}
