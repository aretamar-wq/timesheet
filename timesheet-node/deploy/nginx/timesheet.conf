# Cocos Bank Timesheet - sitio de nginx.
# Copiar a /etc/nginx/sites-available/timesheet.conf y enlazar en sites-enabled (Debian/Ubuntu),
# o a /etc/nginx/conf.d/timesheet.conf (RHEL/Rocky). Probar con "nginx -t" y recargar con "systemctl reload nginx".
#
# nginx sirve el frontend compilado (frontend/dist) y deriva /api al backend Node, que escucha solo en localhost.
# Cambiar server_name por el nombre DNS que asigne IT.

server {
    listen 80;
    server_name timesheet.bv.voii.com.ar;

    # --- HTTPS ---
    # El login recibe la contraseña de red: en producción el sitio debe servirse por HTTPS. Cuando esté el
    # certificado, descomentar el bloque 443 de abajo, reemplazar todo el contenido de este bloque por la línea
    # siguiente y poner COOKIE_SEGURA=true en backend/.env:
    # return 301 https://$host$request_uri;

    include /etc/nginx/snippets/timesheet-app.conf;
}

